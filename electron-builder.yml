appId: vn.duochat.app
productName: DuoChat
directories:
  output: dist
files:
  - out/**/*
  - resources/**/*
  - package.json
win:
  icon: resources/icon.png
  target:
    - { target: nsis, arch: [x64] }
    - { target: portable, arch: [x64] }
publish:
  - provider: github
    owner: MinhPC
    repo: DuoChat
    releaseType: release
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
